
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: platform-${{ runner.os }}

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Prepare development environment
        run: just _init-platform

      - name: Check, test, and lint
        run: just _ci

      - name: Build the Zellij plugin
        if: runner.os == 'Linux'
        run: just wasm

      - name: Upload WASM
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: zj-status-toolbar
          path: target/wasm32-wasip1/release/zj-status-toolbar.wasm
          if-no-files-found: error

  quality:
    name: Code health
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: quality

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Prepare development environment
        run: just _init-quality

      - name: Code health
        run: just code-health

